<div
  #readerHost
  class="reader"
  [class.single-page-view]="isSinglePageView"
  [class.navigation-visible]="showPageNavigation"
  [class.reader-fullscreen]="isFullscreen"
  (click)="onReaderBackgroundClick()"
>
  <app-magic-backdrop />

  <app-chapter-menu
    [markers]="chapterMarkers"
    [currentPageIndex]="currentIndex"
    [open]="showMenu"
    [controlsHidden]="isFullscreen && !showPageNavigation"
    [resumePageIndex]="resumePageIndex"
    [resumeProgress]="resumeProgress"
    (toggleRequested)="toggleMenu()"
    (chapterSelected)="jumpToChapter($event)"
    (resumeRequested)="resumeReading()"
    (interactionStarted)="pauseFullscreenControls($event)"
    (interactionEnded)="resumeFullscreenControls($event)"
  />

  <div
    class="book-shell"
    [class.is-reading]="showReadingUnderlay"
    (pointerdown)="onBookPointerDown($event)"
    (pointerup)="onBookPointerUp($event)"
    (pointercancel)="cancelBookPointer()"
    (touchstart)="onBookTouchStart($event)"
    (touchend)="onBookTouchEnd($event)"
    (touchcancel)="cancelBookSwipe()"
    (click)="onBookClick($event); $event.stopPropagation()"
  >
    <div class="underlay underlay-left" [class.visible]="showLeftUnderlay"></div>
    <div class="underlay underlay-right" [class.visible]="showRightUnderlay"></div>

    <div
      #bookHost
      class="book"
      [class.reader-open]="showReadingUnderlay"
      [class.opening-cover]="isOpeningCover"
    >
      @for (page of pages; track page.src) {
        <div
          class="book-page"
          [attr.data-density]="page.density"
          [class.front-cover-page]="page.role === 'front-cover'"
          [class.inside-cover-page]="page.role === 'inside-cover'"
          [class.content-page]="page.role === 'content'"
          [class.blank-page]="page.role === 'blank'"
          [class.back-cover-page]="page.role === 'back-cover'"
          [class.page-left]="page.side === 'left'"
          [class.page-right]="page.side === 'right'"
        >
          <div class="page-visual">
            <div class="paper-window" [class.joined-spread]="!!page.spreadSrc">
              @if (page.spreadSrc) {
                <div
                  class="spread-half"
                  [class.left-half]="page.side === 'left'"
                  [class.right-half]="page.side === 'right'"
                  [style.background-image]="'url(' + page.spreadSrc + ')'"
                ></div>
              } @else if (getPageSrc(page, $index); as pageSrc) {
                <picture class="page-picture">
                  @if (getMobilePageSrc(page, $index); as mobilePageSrc) {
                    <source
                      media="(max-width: 900px)"
                      [srcset]="mobilePageSrc"
                      type="image/webp"
                    />
                  }
                  <img
                    [src]="pageSrc"
                    class="page-image"
                    [alt]="page.alt"
                    [attr.loading]="$index <= 1 ? 'eager' : 'lazy'"
                    [attr.fetchpriority]="$index === 0 ? 'high' : null"
                    decoding="async"
                  />
                </picture>
              } @else {
                <div class="page-placeholder" aria-hidden="true"></div>
              }
            </div>
          </div>
        </div>
      }
    </div>

  </div>

  <app-reader-controls
    [visible]="showPageNavigation"
    [currentIndex]="scrubTargetIndex"
    [lastIndex]="lastIndex"
    [canGoPrevious]="canGoPrevious"
    [canGoNext]="canGoNext"
    [isFullscreen]="isFullscreen"
    [flipState]="flipState"
    [progress]="readerProgress"
    (previousRequested)="prevPage()"
    (nextRequested)="nextPage()"
    (fullscreenRequested)="toggleFullscreen()"
    (scrubPreviewed)="previewPageScrub($event)"
    (scrubCommitted)="commitPageScrub($event)"
    (activity)="onFullscreenControlsActivity()"
    (interactionStarted)="pauseFullscreenControls($event)"
    (interactionEnded)="resumeFullscreenControls($event)"
  />

</div>
