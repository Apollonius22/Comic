    <span class="magic-mote" style="--x: 78%; --y: 25%; --s: 5px; --d: 9s; --delay: -2s"></span>
    <span class="magic-mote" style="--x: 63%; --y: 82%; --s: 3px; --d: 10s; --delay: -7s"></span>
    <span class="magic-mote" style="--x: 48%; --y: 12%; --s: 7px; --d: 12s; --delay: -4s"></span>
    <span class="magic-mote" style="--x: 12%; --y: 42%; --s: 4px; --d: 8.5s; --delay: -6s"></span>
    <span class="magic-mote" style="--x: 86%; --y: 58%; --s: 5px; --d: 10.5s; --delay: -3s"></span>
    <span class="magic-mote" style="--x: 41%; --y: 86%; --s: 4px; --d: 9.5s; --delay: -8s"></span>
    <span class="magic-mote" style="--x: 24%; --y: 56%; --s: 3px; --d: 7.5s; --delay: -2.5s"></span>
    <span class="magic-mote" style="--x: 70%; --y: 12%; --s: 6px; --d: 12.5s; --delay: -9s"></span>
    <span class="magic-mote" style="--x: 55%; --y: 38%; --s: 4px; --d: 9.2s; --delay: -5.5s"></span>
    <span class="magic-mote" style="--x: 8%; --y: 18%; --s: 5px; --d: 11.5s; --delay: -1.5s"></span>
    <span class="magic-mote" style="--x: 15%; --y: 66%; --s: 2px; --d: 6.8s; --delay: -3.6s"></span>
    <span class="magic-mote" style="--x: 28%; --y: 31%; --s: 3px; --d: 8.8s; --delay: -6.4s"></span>
    <span class="magic-mote" style="--x: 36%; --y: 72%; --s: 2px; --d: 7.4s; --delay: -1.8s"></span>
    <span class="magic-mote" style="--x: 44%; --y: 24%; --s: 3px; --d: 9.8s; --delay: -7.2s"></span>
    <span class="magic-mote" style="--x: 52%; --y: 70%; --s: 2px; --d: 7.9s; --delay: -4.1s"></span>
    <span class="magic-mote" style="--x: 61%; --y: 19%; --s: 3px; --d: 8.2s; --delay: -2.7s"></span>
    <span class="magic-mote" style="--x: 67%; --y: 48%; --s: 2px; --d: 6.9s; --delay: -5.9s"></span>
    <span class="magic-mote" style="--x: 75%; --y: 73%; --s: 3px; --d: 9.4s; --delay: -8.5s"></span>
    <span class="magic-mote" style="--x: 83%; --y: 34%; --s: 2px; --d: 7.1s; --delay: -3.2s"></span>
    <span class="magic-mote" style="--x: 91%; --y: 21%; --s: 3px; --d: 10.1s; --delay: -6.8s"></span>
    <span class="magic-mote" style="--x: 21%; --y: 84%; --s: 2px; --d: 8.1s; --delay: -4.9s"></span>
    <span class="magic-mote" style="--x: 88%; --y: 80%; --s: 2px; --d: 7.7s; --delay: -2.2s"></span>
  </div>

  <div class="dragon-menu" (click)="$event.stopPropagation()">
    <button
      type="button"
      class="dragon-button"
      aria-label="Open comic menu"
      [attr.aria-expanded]="showMenu"
      (click)="toggleMenu()"
    >
      <span class="dragon-neck neck-1"></span>
      <span class="dragon-neck neck-2"></span>
      <span class="dragon-neck neck-3"></span>
      <span class="dragon-neck neck-4"></span>
      <span class="dragon-neck neck-5"></span>
      <span class="dragon-head head-1"></span>
      <span class="dragon-head head-2"></span>
      <span class="dragon-head head-3"></span>
      <span class="dragon-head head-4"></span>
      <span class="dragon-head head-5"></span>
    </button>

    @if (showMenu) {
      <div class="menu-panel">
        <a
          class="menu-item"
          href="assets/exports/comic.pdf"
          download="comic-flipbook.pdf"
        >
          Export as flipbook PDF
        </a>
        @if (gifExportAvailable) {
          <a
            class="menu-item"
            href="assets/exports/comic.gif"
            download="comic-flipbook.gif"
          >
            Export as animated GIF
          </a>
        }
      </div>
    }
  </div>

  <div class="book-shell" [class.is-reading]="showReadingUnderlay">
    <div class="underlay underlay-left" [class.visible]="showLeftUnderlay"></div>
    <div class="underlay underlay-right" [class.visible]="showRightUnderlay"></div>

    <div
      #bookHost
      class="book"
      [class.reader-open]="showReadingUnderlay"
      [class.opening-cover]="isOpeningCover"
    >
      @for (page of pages; track page.src) {
        <div
          class="book-page"
          [attr.data-density]="page.density"
          [class.front-cover-page]="page.role === 'front-cover'"
          [class.inside-cover-page]="page.role === 'inside-cover'"
          [class.content-page]="page.role === 'content'"
          [class.blank-page]="page.role === 'blank'"
          [class.back-cover-page]="page.role === 'back-cover'"
          [class.page-left]="page.side === 'left'"
          [class.page-right]="page.side === 'right'"
        >
          <div class="page-visual">
            <div class="paper-window" [class.joined-spread]="!!page.spreadSrc">
              @if (page.spreadSrc) {
                <div
                  class="spread-half"
                  [class.left-half]="page.side === 'left'"
                  [class.right-half]="page.side === 'right'"
                  [style.background-image]="'url(' + page.spreadSrc + ')'"
                ></div>
              } @else if (getPageSrc(page, $index); as pageSrc) {
                <img
                  [src]="pageSrc"
                  class="page-image"
                  [alt]="page.alt"
                  loading="lazy"
                  decoding="async"
                />
              } @else {
                <div class="page-placeholder" aria-hidden="true"></div>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <button
    type="button"
    class="nav-button left"
    aria-label="Previous pages"
    (click)="prevPage(); $event.stopPropagation()"
  >
    ‹
  </button>

  <button
    type="button"
    class="nav-button right"
    aria-label="Next pages"
    (click)="nextPage(); $event.stopPropagation()"
  >
    ›
  </button>

  @if (showUI) {
    <div class="ui">
      {{ spreadStart }}-{{ spreadEnd }} / {{ pages.length }}
    </div>
  }

</div>
